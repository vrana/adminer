name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: php-actions/composer@v6
      - uses: php-actions/phpcs@v1
        with:
          path: .
          standard: conf/phpcs.xml
      - uses: php-actions/phpstan@v3
        with:
          version: latest
          configuration: conf/phpstan.neon
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --no-save --prefix . eslint @eslint/js globals
      - run: npx eslint -c conf/eslint.config.mjs
