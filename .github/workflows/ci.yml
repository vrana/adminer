name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # ESLint checks externals/jush, otherwise it would silently find no files there
      - uses: php-actions/composer@v6
      - run: composer test
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --no-save --prefix . eslint @eslint/js globals # composer install runs in a container without npm
      - run: composer check
